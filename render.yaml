previews:
  generation: manual

services:
  - type: web
    name: frovely-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm run render:build:backend
    startCommand: npm run render:start:backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: frovely_session
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CSRF_COOKIE_NAME
        value: frovely_csrf
      - key: CSRF_HEADER_NAME
        value: x-csrf-token
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      - key: BETA_INVITE_ONLY
        value: "true"
      - key: BETA_INVITE_LIMIT
        value: "30"
      - key: BETA_ACCESS_ENABLED
        value: "true"
      - key: PREMIUM_FEATURES_ENABLED
        value: "false"
      - key: REMINDER_BATCH_SIZE
        value: "250"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Frovely Admin
